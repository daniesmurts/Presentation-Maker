# deploy/docker-compose.yml — production on one VM with Docker.
#
# Two API replicas (rolling restart = zero-downtime deploys; both run every
# scheduled job's timer but only one wins the lease per tick — CLAUDE.md
# §3.12), Caddy in front (TLS, static bundle, /api load-balanced), and a
# one-shot `migrate` job that uses the SAME image about to serve traffic.
# Postgres: a managed database is the target (it holds the data and should
# not share the app containers' lifecycle), but for an MVP with no users
# the `db` service below runs it on the same VM at no extra cost — opt in
# with COMPOSE_PROFILES=local-db in .env and DATABASE_URL pointing at
# `db`. Moving to managed later is one pg_dump / restore (see
# YANDEX-CLOUD.md). deploy/backup-db.sh dumps it nightly to Object Storage.
#
# Variables come from deploy/.env on the VM (see DEPLOYMENT.md):
#   IMAGE_REPO, IMAGE_TAG, DOMAIN, plus the app's own env (DATABASE_URL, …)

x-api: &api
  image: ${IMAGE_REPO}-api:${IMAGE_TAG}
  env_file: .env
  restart: unless-stopped
  environment:
    PORT: "3000"
    # The frontend is same-origin behind Caddy; CORS only needs to allow it.
    FRONTEND_URL: https://${DOMAIN}
  healthcheck:
    # node's own http module — node:22-slim ships neither curl nor wget.
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 15s
    retries: 3
  volumes:
    # Local-disk fallback for uploads when STORAGE_* is unset. Both replicas
    # mount the SAME host path — they are stateless siblings.
    - ./uploads:/app/uploads
    # The managed database's CA (DATABASE_SSL_CA=/app/certs/root.crt in .env).
    - ./certs:/app/certs:ro
  depends_on:
    db:
      condition: service_healthy
      required: false   # only when the local-db profile is active

services:
  api:
    <<: *api
    container_name: tezarium-api
  api2:
    <<: *api
    container_name: tezarium-api-2

  web:
    image: ${IMAGE_REPO}-web:${IMAGE_TAG}
    container_name: tezarium-web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - api2

  migrate:
    image: ${IMAGE_REPO}-api:${IMAGE_TAG}
    env_file: .env
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      db:
        condition: service_healthy
        required: false
    profiles: ["tools"]
    command: ["node", "scripts/migrate.js"]

  # MVP-only local database (profile local-db). Data lives in ./pgdata on
  # the VM's disk. Not exposed on any host port: the app reaches it as
  # `db:5432` on the compose network, nothing else can.
  db:
    image: postgres:16
    container_name: tezarium-db
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: tezarium
      POSTGRES_USER: tezarium
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tezarium -d tezarium"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
