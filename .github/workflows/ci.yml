name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The newest push to a ref is the only one whose result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pin to the version production will run (CLAUDE.md §9: CI exists to
      # catch what breaks in production, so it must not track a dev laptop).
      # 22 = current LTS at project start (2026-09). Change here and in the
      # Dockerfile together, never one without the other.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (backend)
        run: npm run typecheck --workspace=backend
      - name: Unit tests (backend)
        run: npm run test --workspace=backend

  migrate:
    name: Migrations apply on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tezarium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Same runner production uses, so a migration that only works against
      # an already-populated schema fails here, not on a deploy.
      - name: Apply migrations
        run: node backend/scripts/migrate.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tezarium_test
      # Idempotence: the second run must apply nothing.
      - name: Re-run is a no-op
        run: node backend/scripts/migrate.js | grep -q 'All migrations already applied'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tezarium_test

  images:
    name: Build images (push on main when a registry is configured)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Never publish an artifact that hasn't passed the suites — a tag is a
    # promise about what's in it.
    needs: [test, migrate]
    steps:
      - uses: actions/checkout@v4

      # Same string the backend reports from /health and the bundle serves at
      # /version.txt: "0.1.0 (2026-09-14+abc1234)". The IMAGE TAG is the
      # hyphenated form — Docker tags allow neither spaces nor parentheses —
      # and deploy/deploy.sh recomputes it byte-for-byte from the same inputs.
      - name: Compute version
        id: version
        run: |
          SEMVER="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "build_version=${SEMVER} ($(date -u +%Y-%m-%d)+${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "image_tag=${SEMVER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # Publishing is opt-in: without registry secrets the images are still
      # BUILT (which is what catches a broken Dockerfile), just not pushed.
      # Any registry that speaks docker login: set REGISTRY (host), IMAGE_REPO
      # (host/namespace/name — the api/web suffixes are appended),
      # REGISTRY_USER and REGISTRY_PASSWORD as repository secrets.
      # Secrets are passed through env, NEVER interpolated into the script:
      # REGISTRY_PASSWORD is a JSON key full of double quotes, and inlined
      # into `[ -n "…" ]` it broke the test — every run said "not
      # configured" with all four secrets present (found on the first real
      # push attempt, 2026-09-14).
      - name: Registry configured?
        id: registry
        env:
          REGISTRY: ${{ secrets.REGISTRY }}
          IMAGE_REPO: ${{ secrets.IMAGE_REPO }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "$REGISTRY" ] && [ -n "$IMAGE_REPO" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"; echo "repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "repo=tezarium" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: steps.registry.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build api image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ steps.registry.outputs.enabled == 'true' && github.event_name == 'push' }}
          # buildx attaches provenance/SBOM manifests by default; some
          # registries (Yandex Container Registry among them) reject the
          # multi-manifest structure outright. Off explicitly.
          provenance: false
          sbom: false
          build-args: BUILD_VERSION=${{ steps.version.outputs.build_version }}
          tags: |
            ${{ steps.registry.outputs.repo }}-api:${{ steps.version.outputs.image_tag }}
            ${{ steps.registry.outputs.repo }}-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ steps.registry.outputs.enabled == 'true' && github.event_name == 'push' }}
          provenance: false
          sbom: false
          build-args: BUILD_VERSION=${{ steps.version.outputs.build_version }}
          tags: |
            ${{ steps.registry.outputs.repo }}-web:${{ steps.version.outputs.image_tag }}
            ${{ steps.registry.outputs.repo }}-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Summary
        run: |
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${{ steps.version.outputs.build_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag: \`${{ steps.version.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.registry.outputs.enabled }}" != "true" ]; then
            echo "- **not pushed** — set REGISTRY, IMAGE_REPO, REGISTRY_USER, REGISTRY_PASSWORD secrets to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
