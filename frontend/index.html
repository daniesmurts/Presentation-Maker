<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Тезариум — от тезисов к выступлению</title>
    <!-- Static fallback card for any app URL that isn't /s/:token (which
         gets its own per-talk card from routes/shareCard.ts — these tags
         are baked into the built HTML, so link-preview scrapers that don't
         execute JS still see SOMETHING instead of nothing, even for a
         plain /login or /talks link. Absolute URLs: scrapers don't resolve
         relative ones against the page they fetched. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Тезариум" />
    <meta property="og:title" content="Тезариум — от тезисов к выступлению" />
    <meta property="og:description" content="Тезариум превращает ваши тезисы в готовое выступление: план, слайды, текст для докладчика." />
    <meta property="og:url" content="https://tezarium.ru" />
    <meta property="og:image" content="https://tezarium.ru/og.png" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Three faces, all with full Cyrillic: Literata (display, speaker
         notes), Golos Text (UI), JetBrains Mono (numbers). display=swap so
         text never goes invisible while they load; the fallback stacks in
         tailwind.config.ts are metric-close enough not to jump much. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <!-- Stamp the saved theme before first paint (lib/theme.ts owns the key). -->
    <script>try{var t=localStorage.getItem('tezarium-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
